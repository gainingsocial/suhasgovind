name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `run` is required — pnpm reserves the bare `ci` command.
      - run: pnpm run ci
        env:
          # The dashboard build inlines these. They are public values, not secrets:
          # the anon key is RLS-constrained by design.
          NEXT_PUBLIC_API_URL: https://api.gainingsocial.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Needs the database, so it only runs where the secret is available — a fork PR
    # cannot reach it, which is the point.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
